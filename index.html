<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f2347">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WAMD Wallet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>وَمض | WAMD — محفظة رقمية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f4f8;--s:#fff;--t:#14213d;--m:#6a7186;--l:#e2e5ee;--navy:#0f2347;--gold:#c9a24b;--ok:#12805c;--bad:#c0332f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--s:#16203a;--t:#eef1f8;--m:#98a2bd;--l:#27345a;--ok:#4cd6a0;--bad:#ff8a84}}
:root[data-theme="dark"]{--bg:#0c1220;--s:#16203a;--t:#eef1f8;--m:#98a2bd;--l:#27345a;--ok:#4cd6a0;--bad:#ff8a84}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:14px 16px 90px}
.logo{font-weight:700;letter-spacing:2px;color:var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--navy),#27457f);color:#fff;border-radius:22px;padding:20px}
.hero small{opacity:.75}
.big{font-size:34px;font-weight:700;direction:ltr;text-align:right}
.box{background:var(--s);border:1px solid var(--l);border-radius:16px;padding:12px 14px;margin-top:12px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--m);font-size:13px}.ltr{direction:ltr;unicode-bidi:embed}
h2{font-size:15px;margin:16px 0 4px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:11px 12px}
.btn{width:100%;margin-top:14px;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;font-size:16px;background:var(--navy);color:#fff;cursor:pointer}
.btn.g{background:var(--gold);color:#14213d}.btn.o{background:none;border:1px solid var(--l);color:var(--t)}
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--s);border-top:1px solid var(--l);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;width:100%;max-width:480px}
.nav button{flex:1;background:none;border:0;padding:10px 0;font:inherit;font-size:12px;color:var(--m);cursor:pointer}
.nav button.on{color:var(--gold);font-weight:700}
.nav b{display:block;font-size:20px}
.seg{display:flex;gap:6px;margin:12px 0}
.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--l);background:var(--s);color:var(--t);font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--l);font-size:14px}
.tx:last-child{border:0}.pos{color:var(--ok)}.neg{color:var(--bad)}
.card{border-radius:20px;padding:20px;color:#fff;background:linear-gradient(135deg,#0f2347,#3b5fa8 60%,#c9a24b);min-height:190px;display:flex;flex-direction:column;justify-content:space-between;direction:ltr}
.fp{width:92px;height:92px;border-radius:50%;margin:18px auto 6px;border:3px solid var(--gold);display:grid;place-items:center;font-size:42px;background:var(--s);cursor:pointer;user-select:none;touch-action:none;transition:box-shadow .2s}
.fp.hold{box-shadow:0 0 0 10px rgba(201,162,75,.3)}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:30}.ov.on{display:flex}
.sheet{background:var(--s);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline:12px;max-width:456px;margin:auto;background:#0f2347;color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;z-index:40;display:none;border:1px solid var(--gold)}
.chip{font-size:12px;border-radius:99px;padding:1px 8px;background:var(--l);color:var(--m)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body{background:radial-gradient(120% 60% at 50% 0,rgba(15,35,71,.12),transparent 60%),var(--bg)}
.hero{position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(15,35,71,.28)}
.hero:after{content:"";position:absolute;inset-inline-start:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(201,162,75,.22)}
.hero>*{position:relative;z-index:1}
.box{box-shadow:0 2px 10px rgba(15,35,71,.06)}
.btn{background:linear-gradient(135deg,#0f2347,#27457f);box-shadow:0 6px 14px rgba(15,35,71,.2)}
.btn.g{background:linear-gradient(135deg,#c9a24b,#e3c273);color:#14213d}
.btn.lg{margin-top:28px}
.nav{backdrop-filter:blur(12px);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.nav button.on b{transform:translateY(-2px)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.qa button{background:var(--s);border:1px solid var(--l);border-radius:16px;padding:12px 2px;font:inherit;font-size:12px;color:var(--t);cursor:pointer;box-shadow:0 2px 10px rgba(15,35,71,.06)}
.qa b{display:block;font-size:22px}
.hi{text-align:center;font-size:20px;font-weight:700;margin-top:14px}
.fp{width:112px;height:112px;font-size:54px;box-shadow:0 0 0 8px rgba(201,162,75,.15)}
.fp.hold{animation:pl 1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 20px rgba(201,162,75,.05)}}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--navy),#27457f);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:18px}
.bell{position:relative;background:var(--s);border:1px solid var(--l);border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}
.bell i{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--bad);color:#fff;font-style:normal;font-size:11px;border-radius:99px;padding:0 5px}
.scr{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x mandatory}
.of{flex:0 0 78%;scroll-snap-align:start;border-radius:18px;padding:14px;color:#fff;cursor:pointer;min-height:140px}
.bar{height:6px;border-radius:9px;background:var(--l);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e3c273)}
body.lg{background:linear-gradient(160deg,#08142e,#17356b 70%,#1f4a8f);--t:#fff;--m:#a9b6d3;--s:rgba(255,255,255,.08);--l:rgba(255,255,255,.2);--bg:rgba(255,255,255,.1)}
#stm{position:fixed;inset:0;background:#fff;color:#111;z-index:50;overflow:auto;padding:18px;display:none}
.gauge{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--l) 0);display:grid;place-items:center}.gauge b{width:48px;height:48px;border-radius:50%;background:var(--s);display:grid;place-items:center}
.nav button{font-size:11px}
#stm th,#stm td{text-align:right;padding:5px}
@media print{body>*:not(#stm){display:none!important}#stm{position:static;overflow:visible}.noprint{display:none!important}}
.lg .app{padding-bottom:30px}.lg .btn:not(.g):not(.o){background:linear-gradient(135deg,#c9a24b,#e3c273);color:#0f2347}.lg .btn.o{color:#fff}.lg .fp{background:rgba(255,255,255,.08);color:#fff}
.mark{width:72px;height:72px;margin:0 auto;border-radius:22px;background:linear-gradient(135deg,#c9a24b,#e8cd8a);color:#0f2347;font-weight:700;font-size:24px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 6px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold)}.dots i.f{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:10px auto}.pad button{height:64px;border-radius:50%;border:1px solid var(--l);background:var(--s);color:var(--t);font:inherit;font-size:24px;cursor:pointer}.pad button:active{background:var(--gold);color:#0f2347}
</style>
</head>
<body>
<div class="toast" id="toast" role="status"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="app" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const BANKS={"80":"مصرف الراجحي","10":"البنك الأهلي السعودي","05":"مصرف الإنماء","20":"بنك الرياض","15":"بنك البلاد","60":"بنك الجزيرة","91":"وَمض"};
const NAMES=["عبدالله القحطاني","سارة العتيبي","محمد الدوسري","نورة الشمري","فهد الحربي","ريم الزهراني","خالد المطيري","هند السبيعي"];
const BILLERS={"001":"الشركة السعودية للكهرباء","002":"المياه الوطنية","003":"شركة الاتصالات","004":"المرور (مخالفات)","005":"الجوازات"};
let DB={},U=null,M=null,tab="home",sub="own",hide=false,auth={step:"phone"},idle;
try{DB=JSON.parse(localStorage.getItem("itc1")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("itc1",JSON.stringify(DB))}catch(e){}};
const hash=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))%1e9;return h};
function mod97(s){let r=0;for(const c of s){const v=/[A-Z]/.test(c)?String(c.charCodeAt(0)-55):c;for(const d of v)r=(r*10+ +d)%97}return r}
const ibanOk=i=>/^SA\d{22}$/.test(i)&&mod97(i.slice(4)+"2810"+i.slice(2,4))===1;
function mkIban(code,seed){let a=String(hash(seed)*7919%1e9).padStart(9,"0")+String(hash(seed+"x")%1e9).padStart(9,"0");const b=code+a;const cc=String(98-mod97(b+"281000")).padStart(2,"0");return"SA"+cc+b}
const show=i=>i.replace(/(.{4})/g,"$1 ").trim();
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",6000)}
function sms(t){U.sms.unshift({t,d:new Date().toLocaleString("ar-SA",{dateStyle:"short",timeStyle:"short"})});save();toast("وَمض: "+t)}
function addTx(a,title,amt,extra={}){a.bal=Math.round((a.bal+amt)*100)/100;U.tx.unshift({id:"T"+Date.now().toString(36).toUpperCase(),acc:a.k,title,amt,d:Date.now(),...extra});U.tx=U.tx.slice(0,80)}
function resetIdle(){clearTimeout(idle);if(U)idle=setTimeout(()=>{logout("انتهت الجلسة لعدم النشاط")},120000)}
["click","keydown","touchstart"].forEach(e=>document.addEventListener(e,resetIdle));
function logout(m){U=null;M=null;auth={step:"phone",msg:m};closeS();render()}
const acc=k=>U.acc.find(a=>a.k===k);
const dayOut=()=>U.tx.filter(t=>t.amt<0&&t.lim&&new Date(t.d).toDateString()===new Date().toDateString()).reduce((s,t)=>s-t.amt,0);

/* ---------- login ---------- */
function loginView(){
 const last=localStorage.getItem("itc_last"),bio=last&&DB[last]&&(DB[last].bioSet?DB[last].bio:true);
 const s=auth.step;
 let h=`<div style="text-align:center;margin:34px 0 8px"><div class="mark">W</div><div class="logo" style="font-size:26px;margin-top:10px">WAMD WALLET</div><div class="mut">محفظة رقمية مستقلة</div></div>`;
 if(auth.msg)h+=`<div class="box mut">${auth.msg}</div>`;
 if(s==="phone"){
  if(bio&&!auth.other)h+=`<div class="hi">أهلاً، ${DB[last].name}</div><div class="fp" id="fp" role="button" tabindex="0" aria-label="الدخول السريع">☝️</div><div class="mut" style="text-align:center" id="fpm">المس للمتابعة</div><button class="btn g lg" id="pinb">الدخول بالرمز السري</button><button class="btn o" id="oth">الدخول برقم جوال آخر</button>`;else
  h+=`<label>رقم الجوال</label><input id="ph" inputmode="tel" maxlength="10" placeholder="05XXXXXXXX" dir="ltr" style="text-align:right"><div class="err" id="er"></div><button class="btn" id="go">طلب رمز التحقق</button>`}
 if(s==="pin")h+=`<div class="hi">أهلاً، ${DB[last].name}</div><div class="mut" style="text-align:center">أدخل الرمز السري</div><div class="dots">${[0,1,2,3].map(i=>`<i class="${(auth.pv||"").length>i?"f":""}"></i>`).join("")}</div><div class="err" style="text-align:center">${auth.pe||""}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div><button class="btn o" id="bk">رجوع</button>`;
 if(s==="otp")h+=`<label>رمز التحقق المرسل إلى ${auth.ph}</label><input id="otp" inputmode="numeric" maxlength="6" dir="ltr" style="text-align:right"><div class="err" id="er"></div><button class="btn" id="go">تحقق</button><button class="btn o" id="bk">تغيير الرقم</button>`;
 if(s==="name")h+=`<h2>مرحباً بك! أنشئ حسابك</h2><label>الاسم الكامل</label><input id="nm"><label>الرمز السري للعمليات (4 أرقام)</label><input id="pn" type="password" inputmode="numeric" maxlength="4" dir="ltr" style="text-align:right"><div class="err" id="er"></div><button class="btn g" id="go">فتح الحساب</button>`;
 return h}
function loginBind(){
 const er=m=>$("#er").textContent=m;
 const fp=$("#fp");
 if(fp){const run=()=>{fp.classList.add("hold");$("#fpm").textContent="جارٍ التحقق…";setTimeout(()=>{fp.classList.remove("hold");enter(localStorage.getItem("itc_last"))},1100)};fp.onclick=run;fp.onkeydown=e=>{if(e.key==="Enter")run()};$("#oth").onclick=()=>{auth={step:"phone",other:1};render()};$("#pinb").onclick=()=>{auth={step:"pin"};render()}}
 document.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;auth.pv=auth.pv||"";if(k==="⌫")auth.pv=auth.pv.slice(0,-1);else if(k!==""&&auth.pv.length<4)auth.pv+=k;auth.pe="";if(auth.pv.length===4){const l=localStorage.getItem("itc_last");if(auth.pv===DB[l].pin){auth.pv="";enter(l);return}auth.pv="";auth.pe="الرمز السري غير صحيح"}render()});
 if(auth.step==="pin"&&$("#bk"))$("#bk").onclick=()=>{auth={step:"phone"};render()};
 const go=$("#go");if(!go)return;
 if($("#bk"))$("#bk").onclick=()=>{auth={step:"phone"};render()};
 go.onclick=()=>{
  if(auth.step==="phone"){const p=$("#ph").value.trim();if(!/^05\d{8}$/.test(p))return er("رقم الجوال يجب أن يبدأ بـ 05 ويتكون من 10 أرقام.");
   if(DB[p]&&DB[p].lock>Date.now())return er("الحساب مقفل مؤقتاً بسبب محاولات خاطئة. حاول بعد قليل.");
   auth={step:"otp",ph:p,code:String(100000+Math.floor(Math.random()*900000)),tries:0};render();toast("رمز التحقق: "+auth.code)}
  else if(auth.step==="otp"){if($("#otp").value===auth.code){DB[auth.ph]?enter(auth.ph):(auth.step="name",render())}
   else{auth.tries++;if(auth.tries>=3){DB[auth.ph]=DB[auth.ph]||{};if(DB[auth.ph].acc)DB[auth.ph].lock=Date.now()+30000;save();auth={step:"phone",msg:"تم تجاوز عدد المحاولات. حاول لاحقاً."};render()}else er("الرمز غير صحيح. المحاولات المتبقية: "+(3-auth.tries))}}
  else{const n=$("#nm").value.trim(),p=$("#pn").value;if(n.length<3)return er("أدخل اسمك الكامل.");if(!/^\d{4}$/.test(p))return er("الرمز السري 4 أرقام.");
   DB[auth.ph]={name:n,pin:p,bio:true,bioSet:0,frozen:false,online:true,tx:[],sms:[],acc:[{k:"cur",n:"الرصيد الأساسي",iban:mkIban("91",auth.ph+"c"),bal:10000},{k:"sav",n:"رصيد الادخار",iban:mkIban("91",auth.ph+"s"),bal:0}]};
   DB[auth.ph].tx.push({id:"T0",acc:"cur",title:"رصيد افتتاحي",amt:10000,d:Date.now()});save();enter(auth.ph)}}}
function enter(p){if(DB[p]&&Array.isArray(DB[p].acc)){DB[p].acc.forEach(a=>{if(a.n==="الحساب الجاري")a.n="الرصيد الأساسي";if(a.n==="حساب التوفير")a.n="رصيد الادخار";});save()}if(DB[p]&&DB[p].suspended){auth={step:"phone",msg:"هذا الحساب موقوف. يرجى التواصل مع الإدارة."};render();return}M=p;U=DB[p];U.prev=U.cur;U.cur=Date.now();localStorage.setItem("itc_last",p);tab="home";if(!U.sms.length)sms("مرحباً "+U.name+"، تم تفعيل حسابك في وَمض.");resetIdle();render()}

/* ---------- sheets ---------- */
function openS(h){$("#sheet").innerHTML=h;$("#ov").classList.add("on")}
function closeS(){$("#ov").classList.remove("on")}
$("#ov").onclick=e=>{if(e.target.id==="ov")closeS()};
function confirmOp(title,detail,fn){
 const code=String(1000+Math.floor(Math.random()*9000));
 openS(`<h2>${title}</h2><div class="box mut">${detail}</div><label>الرمز السري</label><input id="cp" type="password" inputmode="numeric" maxlength="4" dir="ltr" style="text-align:right"><label>رمز التأكيد (OTP) المرسل لجوالك</label><input id="co" inputmode="numeric" maxlength="4" dir="ltr" style="text-align:right"><div class="err" id="ce"></div><button class="btn g" id="cg">تأكيد العملية</button><button class="btn o" id="cx">إلغاء</button>`);
 sms("رمز تأكيد العملية: "+code);
 $("#cx").onclick=closeS;
 $("#cg").onclick=()=>{if($("#cp").value!==U.pin)return $("#ce").textContent="الرمز السري غير صحيح.";if($("#co").value!==code)return $("#ce").textContent="رمز التأكيد غير صحيح.";const r=fn();if(r)return $("#ce").textContent=r;save();render();
  openS(`<h2>تمت العملية بنجاح ✓</h2><div class="box mut">${detail}<br>رقم المرجع: <span class="ltr">${U.tx[0].id}</span></div><button class="btn" id="cx">إغلاق</button>`);$("#cx").onclick=closeS}}

/* ---------- views ---------- */
const total=()=>U.acc.reduce((s,a)=>s+a.bal,0);
const bal=n=>hide?"••••••":fmt(n);
const txRow=t=>`<div class="tx" data-tx="${t.id}" style="cursor:pointer"><div>${t.title}${t.status==="pending"?' <span class="chip">قيد المعالجة</span>':""}<div class="mut">${new Date(t.d).toLocaleString("ar-SA",{dateStyle:"short",timeStyle:"short"})} · ${t.id}</div></div><b class="ltr ${t.amt>0?"pos":"neg"}">${t.amt>0?"+":"−"}${fmt(Math.abs(t.amt))}</b></div>`;
function home(){return `<div class="top"><div class="r" style="justify-content:flex-start;gap:10px"><div class="av">${U.name.trim()[0]}</div><div><div class="mut">${new Date().getHours()<12?"صباح الخير":"مساء الخير"}</div><b>${U.name}</b></div></div><button class="bell" data-bell aria-label="الإشعارات">🔔${U.sms.length-(U.seen||0)>0?`<i>${U.sms.length-(U.seen||0)}</i>`:""}</button></div>
<div class="hero"><div class="r"><small>إجمالي الرصيد</small><button class="btn o" style="width:auto;margin:0;padding:2px 10px;color:#fff;border-color:#ffffff55;font-size:13px" id="eye">${hide?"إظهار":"إخفاء"}</button></div><div class="big">${bal(total())} <small style="font-size:15px">SAR</small></div><small>${U.prev?"آخر دخول: "+new Date(U.prev).toLocaleString("ar-SA",{dateStyle:"short",timeStyle:"short"}):"أول دخول لك"}</small></div>
${ads()}<div class="qa"><button data-t="pay" data-s="loc"><b>💸</b>تحويل</button><button data-t="pay" data-s="sad"><b>🧾</b>سداد</button><button data-t="card"><b>💳</b>البطاقة</button><button data-t="hist"><b>📊</b>الحركات</button></div>

function stmt(){let e=$("#stm");if(!e){e=document.createElement("div");e.id="stm";document.body.appendChild(e)}
 const run={cur:acc("cur").bal,sav:acc("sav").bal},R=U.tx.map(t=>{const b=run[t.acc];run[t.acc]-=t.amt;return{...t,b}});
 e.innerHTML=`<div class="noprint r" style="margin-bottom:10px"><button class="btn" onclick="try{window.print()}catch(x){}" style="margin:0">🖨️ طباعة / حفظ PDF</button><button class="btn o" id="stx" style="margin:0 8px 0 0;color:#111">إغلاق</button></div><div style="border-bottom:3px solid #c9a24b;padding-bottom:8px;margin-bottom:10px"><b style="font-size:22px;color:#0f2347">WAMD</b><div style="font-size:12px">كشف عمليات المحفظة · تاريخ الإصدار ${new Date().toLocaleDateString("ar-SA")}</div></div><div style="font-size:13px">العميل: <b>${U.name}</b> · الجوال: ${M}<br>${U.acc.map(a=>`${a.n}: <span dir="ltr">${show(a.iban)}</span> — الرصيد ${fmt(a.bal)} SAR`).join("<br>")}</div><table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:12px"><tr style="background:#0f2347;color:#fff">${["التاريخ","البيان","المرجع","مدين","دائن","الرصيد"].map(h=>`<th>${h}</th>`).join("")}</tr>${R.map(t=>`<tr style="border-bottom:1px solid #ddd"><td>${new Date(t.d).toLocaleDateString("ar-SA")}</td><td>${t.title}${t.acc==="sav"?" (ادخار)":""}</td><td dir="ltr">${t.id}</td><td dir="ltr">${t.amt<0?fmt(-t.amt):""}</td><td dir="ltr">${t.amt>0?fmt(t.amt):""}</td><td dir="ltr">${fmt(t.b)}</td></tr>`).join("")}</table><div style="font-size:11px;margin-top:14px;color:#555">سجل صادر عن وَمض.</div>`;
 e.style.display="block";$("#stx").onclick=()=>e.style.display="none"}
const MK={USD:3.75,EUR:4.08,GBP:4.78,GOLD:372.4},MP={...MK},MN={USD:"دولار أمريكي",EUR:"يورو",GBP:"جنيه إسترليني",GOLD:"ذهب 24 (جرام)"};
function mk(){return Object.keys(MK).map(k=>{const d=MK[k]-MP[k];return `<div class="tx"><span>${MN[k]}</span><b class="ltr ${d>=0?"pos":"neg"}">${fmt(MK[k])} ${d>=0?"▲":"▼"}</b></div>`}).join("")}
setInterval(()=>{["EUR","GBP","GOLD"].forEach(k=>{MP[k]=MK[k];MK[k]=Math.round(MK[k]*(1+(Math.random()-.5)*.004)*100)/100});const e=$("#mk");if(U&&tab==="svc"&&e)e.innerHTML=mk()},4000);
function health(){
 const b=total(),out=U.tx.filter(t=>t.amt<0&&Date.now()-t.d<2592e6).reduce((s,t)=>s-t.amt,0);
 const sc=b+out>0?Math.max(0,Math.min(100,Math.round(b/(b+out)*100))):0;
 return `<div class="box r"><div><b>ملخص استخدام المحفظة</b><div class="mut">الرصيد الحالي ${fmt(b)} ر.س · مصروفات 30 يوماً ${fmt(out)} ر.س</div></div><div class="gauge" style="--p:${sc}"><b>${sc}%</b></div></div>`
}
function svc(){
 return `<h2>خدمات وَمض</h2>${health()}
 <div class="qa" style="grid-template-columns:repeat(2,1fr)">
 ${[["limits","🎚️","حدود الاستخدام"],["fx","💱","صرف العملات"],["pts","🎁","المكافآت والنقاط"],["help","💬","مركز المساعدة"]].map(([k,i,t])=>`<button data-sv="${k}"><b>${i}</b>${t}</button>`).join("")}
 </div>
 <h2>أسعار مرجعية توضيحية</h2><div class="box" id="mk">${mk()}</div>
 <div class="box mut" style="font-size:12px">أسعار إرشادية قابلة للتغيير، وليست أسعار صرف لحظية.</div>`
}
function openLimits(){
 const current=U.transferLimit||50000, card=U.cl||5000;
 openS(`<h2>🎚️ حدود استخدام المحفظة</h2>
 <div class="box mut">يمكنك ضبط حدود التحويل والبطاقة. تُحفظ التغييرات على هذا الجهاز.</div>
 <label>الحد اليومي للتحويل (ر.س)</label>
 <select id="tl">
 ${[10000,25000,50000,75000,100000].map(v=>`<option value="${v}" ${v===current?"selected":""}>${fmt(v)} ر.س</option>`).join("")}
 </select>
 <label>حد الإنفاق اليومي للبطاقة (ر.س)</label>
 <input id="clim" type="number" min="100" max="50000" step="100" value="${card}">
 <div class="err" id="ce"></div>
 <button class="btn g" id="saveLimits">حفظ الحدود</button>
 <button class="btn o" id="cx">إغلاق</button>`);
 $("#cx").onclick=closeS;
 $("#saveLimits").onclick=()=>{
   const t=+$("#tl").value,c=+$("#clim").value;
   if(!Number.isFinite(c)||c<100||c>50000)return $("#ce").textContent="حد البطاقة يجب أن يكون بين 100 و50,000 ر.س.";
   U.transferLimit=t;U.cl=c;save();sms("تم تحديث حدود استخدام المحفظة");closeS();render();
 }
}
function openFx(){openS(`<h2>💱 صرف العملات</h2><div class="box mut">${["USD","EUR","GBP"].map(c=>`${c}: ${fmt((U.fx||{})[c]||0)}`).join(" · ")}</div><label>العملة</label><select id="xc"><option>USD</option><option>EUR</option><option>GBP</option></select><label>العملية</label><select id="xd"><option value="b">شراء عملة (المبلغ بالريال)</option><option value="s">بيع عملة (المبلغ بالعملة)</option></select><label>المبلغ</label><input id="xa" type="number" inputmode="decimal"><div class="box mut" id="xq">أدخل مبلغاً</div><div class="err" id="ce"></div><button class="btn g" id="cg">تنفيذ</button><button class="btn o" id="cx">إغلاق</button>`);
 const q=()=>{const c=$("#xc").value,r=MK[c],a=+$("#xa").value||0,b=$("#xd").value==="b";$("#xq").textContent="ستحصل على "+fmt(b?a/(r*1.005):a*r*.995)+(b?" "+c:" SAR")+" · السعر "+fmt(r)+" (شامل هامش 0.5%)"};["xc","xd","xa"].forEach(i=>$("#"+i).oninput=q);$("#xd").onchange=q;$("#xc").onchange=q;$("#cx").onclick=closeS;
 $("#cg").onclick=()=>{const c=$("#xc").value,r=MK[c],a=+$("#xa").value,b=$("#xd").value==="b",cu=acc("cur");U.fx=U.fx||{USD:0,EUR:0,GBP:0};if(!(a>0))return $("#ce").textContent="أدخل مبلغاً.";if(b){if(a>cu.bal)return $("#ce").textContent="الرصيد غير كافٍ.";const g=Math.round(a/(r*1.005)*100)/100;addTx(cu,"شراء "+fmt(g)+" "+c,-a);U.fx[c]=Math.round(((U.fx[c]||0)+g)*100)/100}else{if(a>(U.fx[c]||0))return $("#ce").textContent="رصيد العملة غير كافٍ.";U.fx[c]=Math.round((U.fx[c]-a)*100)/100;addTx(cu,"بيع "+fmt(a)+" "+c,Math.round(a*r*.995*100)/100)}sms("تمت عملية صرف عملات");save();closeS();render()}}
function openPts(){openS(`<h2>🎁 استبدال النقاط</h2><div class="box mut">رصيدك: <b>⭐ ${U.pts||0}</b> نقطة (كل 10 نقاط = 1 ر.س)</div>${[[250,"قسيمة 25 ر.س"],[500,"قسيمة 50 ر.س"],[1000,"قسيمة 100 ر.س"]].map(([n,t])=>`<div class="box r"><div><b>${t}</b><div class="mut">${n} نقطة</div></div><button class="btn g" data-rd="${n}" style="width:auto;margin:0;padding:8px 12px" ${(U.pts||0)<n?"disabled":""}>استبدال</button></div>`).join("")}<div class="mut">تكسب نقطة عن كل 10 ر.س تنفقها بالبطاقة.</div><button class="btn o" id="cx">إغلاق</button>`);$("#cx").onclick=closeS}
function openHelp(){openS(`<h2>💬 الدعم الفني</h2><div class="box" id="ch" style="max-height:220px;overflow:auto"><div class="mut">مرحباً ${U.name}! اسألني عن رصيد المحفظة أو التحويلات أو البطاقة أو المكافآت…</div></div><div class="r" style="margin-top:8px"><input id="cm" placeholder="اكتب سؤالك"><button class="btn g" id="cs" style="width:auto;margin:0">إرسال</button></div><button class="btn o" id="cx">إغلاق</button>`);$("#cx").onclick=closeS;
 const A=[[/رسوم|عمولة/,"التحويل بين أرصدتك داخل المحفظة مجاني. راجع تفاصيل الرسوم والحدود قبل تأكيد أي عملية."],[/بطاقة|حد/,"من تبويب البطاقة يمكنك إيقاف البطاقة مؤقتاً، وضبط حد الإنفاق، وإنشاء بطاقة افتراضية ."],[/حد|استخدام/,"من تبويب الخدمات ← حدود الاستخدام، يمكنك ضبط الحد اليومي للتحويل والبطاقة."],[/بصمة|دخول|رمز/,"يمكن تفعيل الدخول السريع من «المزيد». نسيت الرمز؟ ابدأ من جديد برقم جوالك."],[/عرض|استرداد|نقاط/,"العروض في الرئيسية، والنقاط تستبدلها من خدمات وَمض."]];
 const add=(t,me)=>{$("#ch").insertAdjacentHTML("beforeend",`<div style="margin:6px 0;text-align:${me?"start":"end"}"><span class="chip" style="background:${me?"var(--gold)":"var(--l)"};color:${me?"#0f2347":"var(--t)"};white-space:normal">${t}</span></div>`);$("#ch").scrollTop=1e5};
 const send=()=>{const q=$("#cm").value.trim();if(!q)return;add(q,1);$("#cm").value="";const a=(A.find(([r])=>r.test(q))||[0,"شكراً لتواصلك. وضّح سؤالك أكثر أو استخدم مركز المساعدة داخل التطبيق؛ لا يوجد مركز اتصال فعلي في هذه النسخة."])[1];setTimeout(()=>add(a),600)};$("#cs").onclick=send;$("#cm").onkeydown=e=>{if(e.key==="Enter")send()}}
document.addEventListener("click",e=>{if(!U)return;const s=e.target.closest("[data-sv]"),rd=e.target.closest("[data-rd]");
 if(s){({limits:openLimits,fx:openFx,pts:openPts,help:openHelp})[s.dataset.sv]();return}
 if(rd){const n=+rd.dataset.rd;if((U.pts||0)>=n){U.pts-=n;addTx(acc("cur"),"استبدال "+n+" نقطة",n/10);sms("تم استبدال "+n+" نقطة بقسيمة "+n/10+" ر.س");save();closeS();render()}}
});
const CAT={"مطعم الديرة":"مطاعم","سوبرماركت الأسواق":"تسوّق","متجر إلكترونيات":"إلكترونيات","محطة وقود":"وقود"};
const OFF=[{k:"cb",i:"💰",t:"استرداد نقدي 5%",s:"على مشترياتك بالبطاقة حتى 50 ر.س لكل عملية",c:"linear-gradient(135deg,#0f2347,#3b5fa8)"},{k:"fast",i:"⚡",t:"تحويلات فورية مجانية",s:"بدون رسوم على التحويل الفوري لجميع الجهات المالية",c:"linear-gradient(135deg,#7a5a12,#c9a24b)"},{k:"sav",i:"🎁",t:"مكافأة الادخار 25 ر.س",s:"أودِع 1,000 ر.س في رصيد الادخار واحصل على المكافأة",c:"linear-gradient(135deg,#0b5d4b,#2aa98a)"}];
function ads(){const o=U.offers||{};let h=`<h2>عروض لك</h2><div class="scr">${OFF.map(f=>`<div class="of" data-of="${f.k}" style="background:${f.c}"><div style="font-size:26px">${f.i}</div><b>${f.t}</b><div style="font-size:12px;opacity:.9">${f.s}</div><span class="chip" style="margin-top:6px;display:inline-block;background:#ffffff33;color:#fff">${o[f.k]?"مفعّل ✓":"التفاصيل"}</span></div>`).join("")}</div>`;
 if(!U.adx)h+=`<div class="box r" style="background:linear-gradient(90deg,var(--s),rgba(201,162,75,.12))"><div><span class="chip">إعلان</span><div><b>قسائم ومكافآت وَمض</b></div><div class="mut">عروض وَمض ومزايا العملاء</div></div><button data-adx class="btn o" style="width:auto;margin:0;padding:4px 10px" aria-label="إغلاق الإعلان">✕</button></div>`;return h}
function insights(){const m={};U.tx.filter(t=>t.amt<0&&Date.now()-t.d<2592e6&&!/رسوم/.test(t.title)).forEach(t=>{const c=t.cat||(/سداد/.test(t.title)?"فواتير":"تحويلات");m[c]=(m[c]||0)-t.amt});const e=Object.entries(m).sort((a,b)=>b[1]-a[1]),mx=e.length?e[0][1]:1;
 return `<h2>مصروفاتك خلال 30 يوماً</h2><div class="box">${e.length?e.map(([c,v])=>`<div style="margin:8px 0"><div class="r mut"><span>${c}</span><span class="ltr">${fmt(v)}</span></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join(""):'<span class="mut">لا مصروفات بعد.</span>'}<div class="r" style="margin-top:10px"><span class="mut">نقاط وَمض</span><b>⭐ ${U.pts||0}</b></div></div>`}
document.addEventListener("click",e=>{if(!U)return;
 if(e.target.closest("[data-adx]")){U.adx=1;save();render();return}
 const t=e.target.closest("[data-tx]"),o=e.target.closest("[data-of]");
 if(t){const x=U.tx.find(v=>v.id===t.dataset.tx);if(x){openS(`<h2>تفاصيل العملية</h2><div class="box">${[["الوصف",x.title],["المبلغ",(x.amt>0?"+":"−")+fmt(Math.abs(x.amt))+" SAR"],["التصنيف",x.cat||(x.amt>0?"إيداع":"تحويلات / فواتير")],["الحساب",x.acc==="sav"?"رصيد الادخار":"الرصيد الأساسي"],["الحالة",x.status==="pending"?"قيد المعالجة":"مكتملة"],["التاريخ",new Date(x.d).toLocaleString("ar-SA")],["رقم المرجع",x.id]].map(([k,v])=>`<div class="r tx"><span class="mut">${k}</span><b>${v}</b></div>`).join("")}</div><button class="btn" id="cx">إغلاق</button>`);$("#cx").onclick=closeS}return}
 if(o){const f=OFF.find(v=>v.k===o.dataset.of),on=(U.offers||{})[f.k];openS(`<h2>${f.i} ${f.t}</h2><div class="box mut">${f.s}<br>الشروط: مرة واحدة لكل عميل.</div><div class="err" id="ce"></div><button class="btn g" id="cg">${on?"العرض مفعّل ✓":"فعّل العرض"}</button><button class="btn o" id="cx">إغلاق</button>`);$("#cx").onclick=closeS;$("#cg").onclick=()=>{if(on)return;if(f.k==="sav"){const s=acc("sav");if(s.bal<1000)return $("#ce").textContent="يلزم رصيد 1,000 ر.س في رصيد الادخار. حوّل مبلغاً من الأساسي أولاً.";addTx(s,"مكافأة الادخار — عرض وَمض",25)}U.offers=U.offers||{};U.offers[f.k]=1;sms("تم تفعيل عرض: "+f.t);closeS();render()};return}
 if(e.target.closest("[data-bell]")){U.seen=U.sms.length;save();openS(`<h2>🔔 الإشعارات</h2><div class="box">${U.sms.slice(0,12).map(s=>`<div class="tx"><div>${s.t}<div class="mut">${s.d}</div></div></div>`).join("")}</div><button class="btn" id="cx">إغلاق</button>`);$("#cx").onclick=closeS;render()}
});

setInterval(()=>{if(!U)return;let ch=false;U.tx.forEach(t=>{if(t.status==="pending"&&Date.now()>t.due){t.status="";ch=true;sms("تم تنفيذ "+t.title)}});if(ch){save();if(!$("#ov").classList.contains("on"))render()}},2000);
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
render();
</script>
</body>
</html>
